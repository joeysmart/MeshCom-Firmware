[env:raspberry_pi]
platform =
	https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
framework = arduino
board = linux_arm
extra_scripts =
	pre:tools/mc_build_defines.py
	pre:tools/nimble_patch.py
	pre:tools/portduino_linux_hardware.py
lib_deps =
	SPI
	bblanchon/ArduinoJson@^7.4.3
	mikalhart/TinyGPSPlus@^1.1.0
	jgromes/RadioLib@7.6.0
lib_ldf_mode = chain+
build_src_filter =
	-<*>
	+<*>
	-<esp32/>
	+<esp32/serial_command_esp32.cpp>
	-<nrf52/>
	-<Displays/>
	-<Fonts/>
	-<GFX_Root/>
	-<safeboot/>
	-<t-deck/>
	-<t-deck-pro/>
	-<t5-epaper/>
	-<lvgl/>
	-<msgstore_settings.cpp>
	-<msgstore_glue.cpp>
	-<batt_functions.cpp>
	-<batt_function_old.cpp>
	-<adc_functions.cpp>
	-<phone_commands.cpp>
	-<aht20.cpp>
	-<bme680.cpp>
	-<bmp390.cpp>
	-<bmx280.cpp>
	-<ina226_functions.cpp>
	-<ltr390.cpp>
	-<mcu811.cpp>
	-<onewire_functions.cpp>
	-<onebutton_functions.cpp>
	-<rtc_functions.cpp>
	-<sht21.cpp>
	-<ntp_async.cpp>
	-<i2c_scanner.cpp>
	-<io_functions.cpp>
	-<Platforms/WirelessPaper/>
	-<Platforms/ESP32/>
	-<Platforms/VisionMasterE213/>
	-<Platforms/VisionMasterE290/>
	-<ui_common/>
	-<web_functions/>
	+<../variants/raspberry_pi/*.cpp>
build_flags =
	${common.build_flags}
	-std=gnu++17
	-I variants/raspberry_pi/compat
	-I src
	-I variants/raspberry_pi
	-include Arduino.h
	-lgpiod
	-li2c
	-O0
