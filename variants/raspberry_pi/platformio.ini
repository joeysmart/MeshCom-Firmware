[env:raspberry_pi]
platform =
	https://github.com/meshtastic/platform-native/archive/86c62edfb7084d11669aa255411a70580e83823b.zip
framework = arduino
board = cross_platform
board_level = extra
lib_deps =
	jgromes/RadioLib@7.6.0
lib_ldf_mode = chain+
build_src_filter =
	-<*>
	+<../variants/raspberry_pi/radio_probe.cpp>
build_flags =
	-D PORTDUINO_LINUX_HARDWARE
	-I variants/raspberry_pi
	-lgpiod
